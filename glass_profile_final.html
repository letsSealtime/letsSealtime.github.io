
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glassmorphism Profile</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    .loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 1s ease;
      opacity: 1;
    }

    .loader-wrapper.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      position: relative;
      width: 64px;
      height: 64px;
      background-color: rgba(0, 0, 0, 0.5);
      transform: rotate(45deg);
      overflow: hidden;
    }

    .loader:after {
      content: '';
      position: absolute;
      inset: 8px;
      background: #222b32;
      z-index: 1;
    }

    .loader:before {
      content: '';
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: -100%;
      top: auto;
      background: #1cd4fc;
      animation: riseLoader 2s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes riseLoader {
      0% {
        bottom: -100%;
        top: 100%;
      }
      50% {
        bottom: 0%;
        top: 0%;
      }
      100% {
        bottom: -100%;
        top: 100%;
      }
    }

    #main-content {
      display: none;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .profile-card {
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 0 40px rgba(28, 212, 252, 0.25), inset 0 0 5px rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 2.2em;
      margin-bottom: 0.3em;
    }

    .subtitle {
      font-size: 1em;
      line-height: 1.6;
      opacity: 0.9;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 24px 0;
    }

    .tab {
      background: #1cd4fc;
      color: #000;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.95em;
      transition: background 0.3s ease;
    }

    .tab:hover {
      background: #ffffff;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 30px;
    }

    .social-icons a {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(4px);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      transition: background 0.3s ease;
    }

    .social-icons a:hover {
      background: rgba(28, 212, 252, 0.3);
    }

    .social-icons svg {
      width: 24px;
      height: 24px;
      fill: #1cd4fc;
      transition: transform 0.2s ease, fill 0.2s ease;
    }

    .social-icons a:hover svg {
      transform: scale(1.1);
      fill: white;
    }
  </style>
</head>
<body>
  <div class="loader-wrapper">
    <span class="loader"></span>
  </div>

  <div id="main-content">
    <div class="container">
      <div class="profile-card">
        <h1>나의 프로필</h1>
        <p class="subtitle">TRPG / 명일방주 / NG</p>
        <div class="tabs">
          <div class="tab">간략 프로필</div>
          <div class="tab">TRPG</div>
          <div class="tab">명일방주</div>
          <div class="tab">NG</div>
        </div>
        <div class="social-icons">
          <a href="#"><svg><use xlink:href="#icon-x" /></svg></a>
          <a href="#"><svg><use xlink:href="#icon-naver" /></svg></a>
          <a href="#"><svg><use xlink:href="#icon-tistory" /></svg></a>
          <a href="#"><svg><use xlink:href="#icon-notion" /></svg></a>
        </div>
      </div>
    </div>
  </div>

  </svg>

  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        const loader = document.querySelector(".loader-wrapper");
        loader.classList.add("fade-out");
        setTimeout(() => {
          loader.style.display = "none";
          document.getElementById("main-content").style.display = "block";
        }, 1000);
      }, 2000);
    });
  </script>
</body>
</html>
