<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROFILE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

        body {
            margin: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #111;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdn%2FMPuii%2FbtsNKzmK0zY%2FMhdJ0BmDVLcuHOUKutKjyk%2Fimg.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            z-index: -1;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 20px rgba(28, 212, 252, 0.2);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #1cd4fc;
            margin-bottom: 20px;
        }

        h1 {
            color: #1cd4fc;
            font-size: 2em;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #ccc;
            font-size: 0.95em;
            margin-bottom: 24px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .tab {
            padding: 8px 12px;
            border: none;
            background: rgba(28, 212, 252, 0.1);
            color: #1cd4fc;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.3s;
        }

        .tab.active {
            background: #1cd4fc;
            color: #111;
            font-weight: bold;
        }

        .tab-content {
            display: none;
            font-size: 0.95em;
            color: #eee;
        }

        .tab-content.active {
            display: block;
        }

        .social-icons {
            margin-top: 30px;
        }

        .social-icons a {
            margin: 0 10px;
        }

        .social-icons img {
            width: 24px;
            height: 24px;
            filter: brightness(0) invert(1);
            transition: transform 0.2s;
        }

        .social-icons img:hover {
            transform: scale(1.2);
        }
    </style>

</head>

<body>
    <div class="background"></div>

    <div class="profile-card">
        <img src="https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdn%2FyKQ87%2FbtsNKwjf6It%2Ft6u7krSXEDtO9yY98XqYLK%2Fimg.png"
            alt="sealTime" class="avatar" />
        <h1>letsSealTime</h1>
        <p class="subtitle">성인. RT많음. 미소녀 취향<br>
            Arknights(CN), DX3rd, 자캐 커뮤니티</p>

        <div class="tabs">
            <button class="tab active" data-tab="profile">기본 프로필</button>
            <button class="tab" data-tab="arknights">명일방주</button>
            <button class="tab" data-tab="trpg">TRPG</button>
            <button class="tab" data-tab="ng">NG</button>
        </div>

        <div class="tab-content active" id="profile">
            <p>어쩌고 저쩌고</p>
        </div>
        <div class="tab-content" id="arknights">
            <p>명일방주 세계관 속 설정입니다.</p>
        </div>
        <div class="tab-content" id="trpg">
            <p>TRPG 캐릭터 설명입니다.</p>
        </div>
        <div class="tab-content" id="ng">
            <p>기타 NG 항목입니다.</p>
        </div>

        <div class="social-icons">
            <a href="#"><img src="link.svg" alt="link" /></a>
            <a href="#"><img src="twitter.svg" alt="Twitter" /></a>
            <a href="#"><img src="youtube.svg" alt="YouTube" /></a>
            <a href="#"><img src="mail.svg" alt="Email" /></a>
        </div>
    </div>

    <script>

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // 탭 버튼 토글
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                // 콘텐츠 토글
                const selected = tab.getAttribute('data-tab');
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.remove('active');
                });
                document.getElementById(selected).classList.add('active');
            });
        });

    </script>
</body>

</html>
