    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

        body {
            margin: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #111;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdn%2FMPuii%2FbtsNKzmK0zY%2FMhdJ0BmDVLcuHOUKutKjyk%2Fimg.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            z-index: -1;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(1px) saturate(150%);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 30px rgba(28, 212, 252, 0.3);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #1cd4fc;
            margin-bottom: 20px;
        }

        h1 {
            color: #1cd4fc;
            font-size: 2em;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #ccc;
            font-size: 0.95em;
            margin-bottom: 24px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .tab {
            padding: 8px 12px;
            border: none;
            background: rgba(28, 212, 252, 0.1);
            color: #1cd4fc;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.3s;
        }

        .tab.active {
            background: #1cd4fc;
            color: #111;
            font-weight: bold;
        }

        .tab-content {
            display: none;
            font-size: 0.95em;
            color: #eee;
        }

        .tab-content.active {
            display: block;
        }

        .social-icons {
            margin-top: 30px;
        }

        .social-icons a {
            margin: 0 10px;
        }

        .social-icons img {
            width: 24px;
            height: 24px;
            filter: brightness(0) invert(1);
            transition: transform 0.2s;
        }

        .social-icons img:hover {
            transform: scale(1.2);
        }

        .icon {
            width: 20px;
            height: 20px;
            fill: #1cd4fc;
            transition: transform 0.2s ease;
            vertical-align: middle;
        }

        .icon:hover {
            transform: scale(1.15);
            fill: white;
            transition: transform 0.3s ease, fill 0.3s ease;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        /* 로딩 전체 래퍼 */
        .loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 1s ease;
        }

        .loader-wrapper.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            position: relative;
            width: 64px;
            height: 64px;
            background-color: rgba(0, 0, 0, 0.5);
            transform: rotate(45deg);
            overflow: hidden;
        }

        .loader:after {
            content: '';
            position: absolute;
            inset: 8px;
            margin: auto;
            background: #222b32;
        }

        .loader:before {
            content: '';
            position: absolute;
            inset: -15px;
            margin: auto;
            background: #1cd4fc;
            animation: diamondLoader 2s linear infinite;
        }

        @keyframes diamondLoader {

            0%,
            10% {
                transform: translate(-64px, -64px) rotate(-45deg)
            }

            90%,
            100% {
                transform: translate(0px, 0px) rotate(-45deg)
            }
        }

        /* FLOW: DOWN */
        [tooltip][flow^="down"]::before {
            top: 100%;
            border-top-width: 0;
            border-bottom-color: #333;
        }

        [tooltip][flow^="down"]::after {
            top: calc(100% + 5px);
        }

        [tooltip][flow^="down"]::before,
        [tooltip][flow^="down"]::after {
            left: 50%;
            transform: translate(-50%, .5em);
        }

        /* KEYFRAMES */
        @keyframes tooltips-vert {
            to {
                opacity: .9;
                transform: translate(-50%, 0);
            }
        }

        @keyframes tooltips-horz {
            to {
                opacity: .9;
                transform: translate(0, -50%);
            }
        }

        [tooltip][flow^="down"]:hover::before,
        [tooltip][flow^="down"]:hover::after {
            animation: tooltips-vert 300ms ease-out forwards;
        }
    </style>

</head>

<body>
    <!-- 로딩 화면 -->
    <div class="loader-wrapper">
        <span class="loader"></span>
    </div>

    <!-- 본문 콘텐츠 -->
    <div id="main-content" style="display:none;">
        <div class="profile-card">
            <img src="https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdn%2FyKQ87%2FbtsNKwjf6It%2Ft6u7krSXEDtO9yY98XqYLK%2Fimg.png"
                alt="sealTime" class="avatar" />
            <h1>letsSealTime</h1>
            <p class="subtitle">성인. RT많음. 미소녀 취향<br>
                Arknights(CN), DX3rd, 자캐 커뮤니티</p>

            <div class="tabs">
                <button class="tab active" data-tab="profile">기본 프로필</button>
                <button class="tab" data-tab="arknights">명일방주</button>
                <button class="tab" data-tab="trpg">TRPG</button>
                <button class="tab" data-tab="ng">NG</button>
            </div>

            <div class="tab-content active" id="profile">
                <p>어쩌고 저쩌고</p>
            </div>
            <div class="tab-content" id="arknights">
                <p>명일방주 세계관 속 설정입니다.</p>
            </div>
            <div class="tab-content" id="trpg">
                <p>TRPG 캐릭터 설명입니다.</p>
            </div>
            <div class="tab-content" id="ng">
                <p>기타 NG 항목입니다.</p>
            </div>

            <div class="social-icons">
                <a href="https://x.com/time2ReachOut" target="_blank">
                    <span tooltip="@Time2ReachOut" flow="down">
                        <svg class="icon">
                            <use xlink:href="#icon-x"></use>
                        </svg>
                    </span>
                </a>

                <a href="https://gaeramm.tistory.com/" target="_blank">
                    <span tooltip="Tistory Home" flow="down"></span>
                    <svg class="icon">
                        <use xlink:href="#icon-home"></use>
                    </svg>
                    </span>
                </a>
                <a href="https://blog.naver.com/gaedol321" target="_blank">
                    <span tooltip="Naver Blog" flow="down">
                        <svg class="icon">
                            <use xlink:href="#icon-blog"></use>
                        </svg>
                    </span>
                </a>
                <a href="https://pao321.notion.site/124f4b1f836845a18bdbc9feda4d3689?pvs=141 " target="_blank">
                    <span tooltip="Backup Notion" flow="down">
                        <svg class=" icon">
                            <use xlink:href="#icon-notion"></use>
                        </svg>
                    </span>
                </a>
            </div>
        </div>

    <div class="background"></div>

    <script>

        window.addEventListener("load", function () {
            setTimeout(function () {
                const loader = document.querySelector(".loader-wrapper");
                loader.classList.add("fade-out");
                setTimeout(() => {
                    loader.style.display = "none";
                    document.getElementById("main-content").style.display = "block";
                }, 1000); 
            }, 1800);
        });

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // 탭 버튼 토글
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                // 콘텐츠 토글
                const selected = tab.getAttribute('data-tab');
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.remove('active');
                });
                document.getElementById(selected).classList.add('active');
            });
        });

    </script>
</body>

</html>
