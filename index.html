<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROFILE</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="background"></div>

    <div class="profile-card">
        <img src="avatar.png" alt="Kal'tsit" class="avatar" />
        <h1>NICKNAME</h1>
        <p class="subtitle">요약 소개개</p>

        <div class="tabs">
            <button class="tab active" data-tab="profile">기본 프로필</button>
            <button class="tab" data-tab="trpg">TRPG</button>
            <button class="tab" data-tab="arknights">명일방주</button>
            <button class="tab" data-tab="ng">NG</button>
        </div>

        <div class="tab-content active" id="profile">
            <p>어쩌고 저쩌고고</p>
        </div>
        <div class="tab-content" id="trpg">
            <p>TRPG 캐릭터 설명입니다.</p>
        </div>
        <div class="tab-content" id="arknights">
            <p>명일방주 세계관 속 설정입니다.</p>
        </div>
        <div class="tab-content" id="ng">
            <p>기타 NG 항목입니다.</p>
        </div>

        <div class="social-icons">
            <a href="#"><img src="link.svg" alt="link" /></a>
            <a href="#"><img src="twitter.svg" alt="Twitter" /></a>
            <a href="#"><img src="youtube.svg" alt="YouTube" /></a>
            <a href="#"><img src="mail.svg" alt="Email" /></a>
        </div>
    </div>

    <script>

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // 탭 버튼 토글
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                // 콘텐츠 토글
                const selected = tab.getAttribute('data-tab');
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.remove('active');
                });
                document.getElementById(selected).classList.add('active');
            });
        });

    </script>
</body>

</html>
